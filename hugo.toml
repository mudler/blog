baseurl      = "https://mudler.pm"
title        = "mudler.pm"
languageCode = "en-us"
enableEmoji  = true
ignoreFiles  = ["\\.Rmd$", "_files$", "_cache$"]

[pagination]
pagerSize = 100

[outputs]
home = ["HTML", "RSS", "JSON"]
page = ["HTML"]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences  = true
guessSyntax = false
lineNos     = false
noClasses   = false

[permalinks]
posts = "/posts/:year/:month/:day/:slug/"

[taxonomies]
category = "blog"
tag      = "tags"
series   = "series"

[[menu.main]]
identifier = "blog"
name       = "blog"
url        = "/posts/"
weight     = 1

[[menu.main]]
identifier = "projects"
name       = "projects"
url        = "/projects/"
weight     = 2

[[menu.main]]
identifier = "about"
name       = "about"
url        = "/about/"
weight     = 3

[[menu.main]]
identifier = "search"
name       = "search"
url        = "/search/"
weight     = 4

[languages.en]
title     = "mudler.pm"
copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

[params]
description = "Ettore Di Giacinto (mudler) — creator of LocalAI. Local AI is the way."
